# ==============================================================================
# AI StudyMate - Fly.io Application Configuration
# Deploys backend container with health checks and persistent volume.
# ==============================================================================

app = "studymate-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  TRUST_PROXY = "true"
  OPENAI_MODEL = "gpt-4o"
  OPENAI_EMBEDDING_MODEL = "text-embedding-3-small"
  AI_GLOBAL_MONTHLY_COST_LIMIT_USD = "250.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[http_service.checks]]
  grace_period = "20s"
  interval = "60s"
  method = "GET"
  timeout = "10s"
  path = "/health/ready"

[mounts]
  source = "studymate_uploads"
  destination = "/app/uploads/documents"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
